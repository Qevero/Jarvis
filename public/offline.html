<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b11" />
    <title>Jarvis · Offline</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #070b11; color: #e6f1ff; font-family: system-ui, -apple-system, sans-serif; padding: 16px; text-align: center; }
      .label { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8aa4bd; }
      button { margin-top: 20px; min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid #38e1ff; background: #38e1ff; color: #031018; font-weight: 600; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" width="72" height="72" alt="" />
      <p class="label">Jarvis · offline</p>
      <p>No connection. Jarvis doesn't keep your financial data on this device, so it needs to be online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
